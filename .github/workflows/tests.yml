name: RReps tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
      - name: Restore locked packages
        shell: pwsh
        run: ./scripts/start.ps1 scripts/setup.R
      - name: Run the R test suite
        shell: pwsh
        run: ./scripts/start.ps1 tests/testthat.R
